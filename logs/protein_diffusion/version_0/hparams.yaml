config:
  T: 0
  backbone: dit
  data:
    _target_: dataloader.MSADataset
    batch_size: 32
    max_depth: 16
    max_length: 256
    num_workers: 8
    pin_memory: true
    root_path: /home/deepfold/users/common/pdb_msa
    val_ratio: 0.1
  eval:
    checkpoint_path: ''
    compute_generative_perplexity: false
    compute_perplexity_on_sanity: false
    gen_ppl_eval_model_name_or_path: null
    generate_samples: true
  loader:
    batch_size: 32
    eval_batch_size: 32
    num_workers: 8
    pin_memory: true
  lr_scheduler:
    T_max: 1000
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    eta_min: 1.0e-06
  model:
    cond_dim: 256
    depth: 6
    dropout: 0.1
    heads: 8
    hidden_size: 512
    length: 4096
    n_blocks: 6
    n_heads: 8
    scale_by_sigma: true
    vocab_size: 30
  noise:
    sigma_max: 20.0
    sigma_min: 0.0001
    type: loglinear
  optim:
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
    lr: 0.0001
    weight_decay: 0.01
  parameterization: subs
  sampling:
    noise_removal: true
    num_sample_batches: 1
    num_sample_log: 2
    predictor: analytic
    steps: 64
  seed: 42
  subs_masking: false
  time_conditioning: true
  trainer:
    accelerator: gpu
    accumulate_grad_batches: 32
    callbacks: {}
    check_val_every_n_epoch: 1
    devices: 1
    gradient_clip_val: 1.0
    log_every_n_steps: 10
    max_epochs: 100
    precision: bf16-mixed
  training:
    antithetic_sampling: true
    change_of_variables: false
    ema: 0.9999
    importance_sampling: false
    sampling_eps: 0.001
tokenizer: !!python/object:dataloader.BioTokenizer
  _vocab_int_to_str:
    0: A
    1: C
    2: D
    3: E
    4: F
    5: G
    6: H
    7: I
    8: K
    9: L
    10: M
    11: N
    12: P
    13: Q
    14: R
    15: S
    16: T
    17: V
    18: W
    19: Y
    20: X
    21: '-'
    22: <pad>
    23: <mask>
    24: <bos>
    25: <eos>
  _vocab_str_to_int:
    '-': 21
    <bos>: 24
    <eos>: 25
    <mask>: 23
    <pad>: 22
    A: 0
    C: 1
    D: 2
    E: 3
    F: 4
    G: 5
    H: 6
    I: 7
    K: 8
    L: 9
    M: 10
    N: 11
    P: 12
    Q: 13
    R: 14
    S: 15
    T: 16
    V: 17
    W: 18
    X: 20
    Y: 19
  bos_token: <bos>
  bos_token_id: 24
  eos_token: <eos>
  eos_token_id: 25
  gap_token_id: 21
  mask_token: <mask>
  mask_token_id: 23
  pad_token: <pad>
  pad_token_id: 22
  special_tokens:
    <bos>: 24
    <eos>: 25
    <mask>: 23
    <pad>: 22
  standard_aas: ACDEFGHIKLMNPQRSTVWYX-
  unk_token: X
  unk_token_id: 20
  vocab:
  - A
  - C
  - D
  - E
  - F
  - G
  - H
  - I
  - K
  - L
  - M
  - N
  - P
  - Q
  - R
  - S
  - T
  - V
  - W
  - Y
  - X
  - '-'
  - <pad>
  - <mask>
  - <bos>
  - <eos>
